[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geoprobe-deepdft"
version = "0.1.0"
description = "Symmetry-preserving geometric probe networks for real-space electron density prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "ase>=3.22.0",
]

[tool.setuptools.packages.find]
include = ["geoprobe_deepdft*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
